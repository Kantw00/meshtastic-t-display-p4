; ESP-Hosted co-processor firmware ("network_adapter", SDIO transport) for the ESP32-C6 of the
; LilyGO T-Display-P4. Sources: espressif/esp_hosted example "slave", unchanged.
;
; Build (PowerShell, not Git Bash):   pio run
;   also refreshes ../c6_fw, the prebuilt image set (flashable with esptool alone, see below)
;
; Flash over the "C6 UART" connector (top edge, next to the MMCX sockets; pins RX, TX, 3.3V, GND,
; LilyGO README image/6.jpg) with a 3.3 V USB-UART adapter: GND-GND, adapter TX -> RX pin,
; adapter RX -> TX pin, 3.3V pin left unconnected, the board stays powered over its own USB.
; The P4 controls the C6 power rail and reset line: it must run the Meshtastic firmware of the
; t-display-p4-tft environment, which powers the C6 and pulses its reset at every P4 start.
; Buttons on the right edge, top to bottom: C6 BOOT, C6 Reset, P4 BOOT, P4 Reset.
;   0. check the wiring: terminal on the adapter port at 115200, press P4 Reset: the C6 must print
;      "ESP-ROM:esp32c6-..." within 2 s. No text = adapter RX is not on the C6 TX pin.
;   1. hold C6 BOOT, press P4 Reset (or power the board up), release C6 BOOT after 3 s: the C6
;      now waits in ROM download mode. Best done while Bluetooth and WiFi are off in Meshtastic
;      (the default), so that the P4 leaves the SDIO bus alone.
;   2. pio run -t upload --upload-port <adapter port>
;      or, with the prebuilt images and esptool 5 only (pip install esptool), from ../c6_fw:
;        esptool --chip esp32c6 --port <adapter port> --baud 460800 --before no-reset --after no-reset
;          write-flash --flash-mode dio --flash-size 4MB --flash-freq 80m 0x0 bootloader.bin
;          0x8000 partition-table.bin 0xd000 ota_data_initial.bin 0x10000 network_adapter.bin
;        esptool --chip esp32c6 --port <adapter port> --before no-reset --after no-reset
;          erase-region 0x9000 0x4000
;   3. press P4 Reset: the C6 restarts with it and runs the new firmware
; The pio upload also blanks the C6 nvs partition (see c6_images.py); erase-region does the same.
[platformio]
src_dir = main
default_envs = t-display-p4-c6

[env:t-display-p4-c6]
; same platform release as the Meshtastic firmware (variants/esp32/esp32-common.ini)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-c6-devkitc-1
; ESP32-C6 module with 4 MB flash; mode and layout as sdkconfig.defaults(.esp32c6) select them
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.partitions = partitions.esp32c6.csv
; CNC1 carries no DTR/RTS: the download mode and the final reset are done with SW3/SW4
board_upload.before_reset = no-reset
board_upload.after_reset = no-reset
upload_speed = 460800
monitor_speed = 115200
extra_scripts = post:c6_images.py
